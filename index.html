<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCargo SafetyHub | Air Cargo Operational Safety & Control Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49',
                        },
                        safety: {
                            amber: '#f59e0b',
                            orange: '#f97316',
                            red: '#ef4444',
                            green: '#10b981'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Alpine.js Core -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @keyframes breathePulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.35); opacity: 1; }
        }
        .animate-breathe {
            animation: breathePulse 8s ease-in-out infinite;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 selection:bg-brand-500 selection:text-white"
      x-data="safetyApp()"
      x-init="initApp()">
    <!-- TOP GLOBAL HEADER -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <!-- Logo & Corporate Branding -->
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-brand-600 via-blue-600 to-amber-500 rounded-xl shadow-lg shadow-brand-500/20 text-white">
                    <i data-lucide="plane-takeoff" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-black text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">SMARTCARGO</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold tracking-widest uppercase">SAFETYHUB</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-medium hidden sm:block" x-text="t('appSubtitle')"></p>
                </div>
            </div>
            <!-- Controls (Lang & View Mode Switcher) -->
            <div class="flex items-center flex-wrap gap-2 sm:gap-3">
                <!-- Language Toggle -->
                <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex items-center">
                    <button @click="setLang('es')" 
                            :class="lang === 'es' ? 'bg-brand-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                            class="px-2.5 py-1 text-xs rounded-md transition-all">
                        ES
                    </button>
                    <button @click="setLang('en')" 
                            :class="lang === 'en' ? 'bg-brand-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                            class="px-2.5 py-1 text-xs rounded-md transition-all">
                        EN
                    </button>
                </div>
                <!-- View Mode Switcher (Worker vs Puesto de Mando) -->
                <div class="bg-slate-800/80 p-1 rounded-lg border border-slate-700 flex items-center">
                    <button @click="viewMode = 'worker'" 
                            :class="viewMode === 'worker' ? 'bg-slate-700 text-white font-semibold' : 'text-slate-400 hover:text-white'"
                            class="px-3 py-1.5 text-xs rounded-md flex items-center gap-1.5 transition-all">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        <span x-text="t('workerMode')"></span>
                    </button>
                    <button @click="toggleAdminView()" 
                            :class="viewMode === 'admin' ? 'bg-amber-600 text-white font-semibold shadow-lg shadow-amber-600/20' : 'text-slate-400 hover:text-white'"
                            class="px-3 py-1.5 text-xs rounded-md flex items-center gap-1.5 transition-all">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i>
                        <span x-text="t('adminMode')"></span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Group Switcher Bar for Workers -->
        <template x-if="viewMode === 'worker'">
            <div class="max-w-7xl mx-auto mt-3 pt-2 border-t border-slate-800 flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                <span class="text-[11px] text-slate-400 font-bold uppercase tracking-wider shrink-0 flex items-center gap-1">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span x-text="t('selectGroupLabel') + ':'"></span>
                </span>
                <template x-for="group in groups" :key="group.id">
                    <button @click="switchWorkerGroup(group.id)" 
                            :class="currentGroupId === group.id ? 'bg-brand-500/20 border-brand-500 text-brand-300 font-bold shadow' : 'bg-slate-800/60 border-slate-700/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'"
                            class="px-3 py-1 text-xs rounded-full border transition-all shrink-0 flex items-center gap-1.5">
                        <i :data-lucide="group.icon" class="w-3.5 h-3.5"></i>
                        <span x-text="group.name[lang]"></span>
                    </button>
                </template>
            </div>
        </template>
    </header>
    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-8">
        <!-- COMPLIANCE & PRIVACY WARNING BANNER -->
        <div class="bg-gradient-to-r from-amber-950/50 via-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div class="flex items-start gap-3">
                <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-xl shrink-0 mt-0.5 border border-amber-500/20">
                    <i data-lucide="shield-ban" class="w-5 h-5"></i>
                </div>
                <div class="text-xs text-slate-300 space-y-1">
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold text-amber-400 tracking-wide uppercase" x-text="t('complianceTitle')"></span>
                        <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.2 rounded font-mono">CONFIDENTIALITY RULE</span>
                    </div>
                    <p x-text="t('complianceWarning')"></p>
                    <p class="text-slate-400 italic text-[11px]" x-text="t('complianceDisclaimer')"></p>
                </div>
            </div>
            <div class="shrink-0 text-right">
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[11px] text-slate-300 font-mono">
                    <i data-lucide="lock" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span x-text="t('dataProtected')"></span>
                </span>
            </div>
        </div>
        <!-- VISTA DE TRABAJADOR (WORKER VIEW) -->
        <template x-if="viewMode === 'worker'">
            <div class="space-y-8">
                <!-- INVALID LINK ERROR SCREEN (IF TOKEN IS REVOKED) -->
                <template x-if="isCurrentLinkRevoked()">
                    <div class="bg-rose-950/40 border-2 border-rose-600 rounded-2xl p-8 text-center space-y-4 max-w-xl mx-auto shadow-2xl">
                        <div class="w-16 h-16 bg-rose-600/20 text-rose-400 rounded-full flex items-center justify-center mx-auto border border-rose-500/30">
                            <i data-lucide="link-2-off" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white" x-text="t('linkRevokedTitle')"></h2>
                        <p class="text-sm text-slate-300" x-text="t('linkRevokedDesc')"></p>
                        <div class="p-3 bg-slate-900 rounded-xl text-xs text-slate-400 font-mono border border-slate-800">
                            Token: <span class="text-rose-400 font-bold" x-text="getGroupToken(currentGroupId)"></span> (Revoked / Expired)
                        </div>
                    </div>
                </template>
                <!-- ACTIVE WORKER DISPLAY -->
                <template x-if="!isCurrentLinkRevoked()">
                    <div class="space-y-8">
                        <!-- CURRENT GROUP HEADER BANNER -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                            <div class="absolute right-0 top-0 bottom-0 w-64 bg-gradient-to-l from-brand-600/10 via-brand-500/5 to-transparent pointer-events-none"></div>
                            <div class="flex items-center gap-4 z-10">
                                <div class="p-4 bg-brand-500/10 border border-brand-500/30 text-brand-400 rounded-2xl shadow-inner">
                                    <i :data-lucide="getCurrentGroup().icon" class="w-8 h-8"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest" x-text="t('groupStation')"></span>
                                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono border border-slate-700" x-text="todayDateStr"></span>
                                    </div>
                                    <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight mt-0.5" x-text="getCurrentGroup().name[lang]"></h1>
                                </div>
                            </div>
                            <div class="mt-4 sm:mt-0 text-xs text-slate-300 flex items-center gap-2 bg-slate-950/80 px-3.5 py-2 rounded-xl border border-slate-800 z-10 shadow">
                                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                                <span x-text="t('activeBriefingSession')"></span>
                            </div>
                        </div>
                        <!-- SECTION 1: TRES PILARES PERMANENTES DE SEGURIDAD -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="shield" class="w-5 h-5 text-brand-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('pillarsHeader')"></h2>
                                </div>
                                <span class="text-[11px] bg-brand-900/60 text-brand-300 border border-brand-700/50 px-2.5 py-0.5 rounded-full font-mono">Standard SMS</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-blue-500 border-t border-r border-b border-slate-800 rounded-xl p-5 shadow-lg relative">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest font-mono">PILAR 01</span>
                                        <i data-lucide="user-shield" class="w-5 h-5 text-blue-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p1.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p1.desc[lang]"></p>
                                </div>
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-amber-500 border-t border-r border-b border-slate-800 rounded-xl p-5 shadow-lg relative">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-amber-400 uppercase tracking-widest font-mono">PILAR 02</span>
                                        <i data-lucide="eye" class="w-5 h-5 text-amber-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p2.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p2.desc[lang]"></p>
                                </div>
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-emerald-500 border-t border-r border-b border-slate-800 rounded-xl p-5 shadow-lg relative">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest font-mono">PILAR 03</span>
                                        <i data-lucide="users" class="w-5 h-5 text-emerald-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p3.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p3.desc[lang]"></p>
                                </div>
                            </div>
                        </section>
                        <!-- SECTION 2: TRES RECORDATORIOS DIARIOS ESPECÍFICOS -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="calendar-check" class="w-5 h-5 text-amber-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('remindersHeader')"></h2>
                                </div>
                                <span class="text-xs text-amber-400/90 flex items-center gap-1 font-mono font-bold bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20">
                                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin"></i>
                                    <span x-text="t('dailyRotationLabel')"></span>
                                </span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <template x-for="(rem, idx) in getDailyRotatedReminders()" :key="rem.id">
                                    <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-3 relative group">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between text-xs">
                                                <span class="font-mono text-amber-400 font-bold" x-text="'#' + (idx + 1) + ' ' + getCurrentGroup().name[lang].toUpperCase()"></span>
                                                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                                            </div>
                                            <h4 class="font-bold text-white text-sm" x-text="rem.title[lang]"></h4>
                                            <p class="text-xs text-slate-300 leading-relaxed" x-text="rem.desc[lang]"></p>
                                        </div>
                                        <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-400 font-mono">
                                            <span x-text="t('verifiedStandard')"></span>
                                            <span class="text-slate-500" x-text="'ID: ' + rem.id"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>
                        <!-- SECTION 3: AVISOS ESPECIALES Y COMUNICADOS OFICIALES -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="megaphone" class="w-5 h-5 text-rose-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('announcementsHeader')"></h2>
                                </div>
                                <span class="text-xs text-slate-400" x-text="getActiveAnnouncements().length + ' ' + t('activeNotices')"></span>
                            </div>
                            <div class="space-y-4">
                                <template x-if="getActiveAnnouncements().length === 0">
                                    <div class="bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl p-8 text-center text-slate-400 space-y-2">
                                        <i data-lucide="check-check" class="w-8 h-8 mx-auto text-emerald-500"></i>
                                        <p class="text-sm font-semibold text-slate-300" x-text="t('noActiveNotices')"></p>
                                    </div>
                                </template>
                                <template x-for="item in getActiveAnnouncements()" :key="item.id">
                                    <div :class="{
                                            'border-l-rose-500 bg-rose-950/20': item.priority === 'High',
                                            'border-l-brand-500 bg-slate-900': item.priority === 'Normal'
                                         }" 
                                         class="border-l-4 border-t border-r border-b border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <div class="flex items-center gap-2">
                                                <span :class="item.priority === 'High' ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' : 'bg-brand-500/20 text-brand-300 border-brand-500/30'" 
                                                      class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border"
                                                      x-text="item.type[lang] || item.type[lang === 'es' ? 'en' : 'es']"></span>
                                                <template x-if="item.priority === 'High'">
                                                    <span class="px-2 py-0.5 rounded bg-rose-600 text-white font-bold text-[10px] tracking-widest uppercase flex items-center gap-1 animate-pulse">
                                                        <i data-lucide="alert-triangle" class="w-3 h-3"></i> URGENTE / URGENT
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="text-[11px] text-slate-400 flex items-center gap-3 font-mono">
                                                <span><i data-lucide="user" class="w-3 h-3 inline mr-1"></i><span x-text="item.author + (item.authorRole ? ' · ' + item.authorRole : '')"></span></span>
                                                <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i><span x-text="formatDate(item.createdAt)"></span></span>
                                            </div>
                                        </div>
                                        <h3 class="text-lg font-black text-white" x-text="item.title[lang] || item.title[lang === 'es' ? 'en' : 'es']"></h3>
                                        <!-- AI/Smart High-Impact Summarized Bullets -->
                                        <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-3.5 space-y-2">
                                            <span class="text-[10px] font-bold text-amber-400 uppercase tracking-widest flex items-center gap-1">
                                                <i data-lucide="zap" class="w-3 h-3"></i> PUNTOS CLAVE PARA EL TURNO / KEY SHIFT TAKEAWAYS:
                                            </span>
                                            <ul class="space-y-1.5 text-xs text-slate-200">
                                                <template x-for="(bullet, bIdx) in (item.summaryBullets[lang] || item.summaryBullets[lang === 'es' ? 'en' : 'es'] || [])" :key="bIdx">
                                                    <li class="flex items-start gap-2">
                                                        <span class="text-brand-400 font-bold">•</span>
                                                        <span x-text="bullet"></span>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                        <div class="pt-2 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                                            <span x-text="t('targetGroup') + ': ' + getTargetDisplay(item.targetGroup)"></span>
                                            <span x-text="'Valid until: ' + item.validUntil"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>
                        <!-- SECTION 4: EJERCICIO DE RESPIRACIÓN Y PREPARACIÓN OPERATIVA (45 SEGUNDOS TRABAJADOR) -->
                        <section class="bg-gradient-to-br from-slate-900 via-slate-900 to-brand-950/50 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="heart-pulse" class="w-5 h-5 text-cyan-400"></i>
                                        <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('breathingTitleWorker')"></h2>
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1" x-text="t('breathingSubtitleWorker')"></p>
                                </div>
                                <div class="flex items-center gap-3 bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl">
                                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                                        <i :data-lucide="voiceEnabled ? 'volume-2' : 'volume-x'" :class="voiceEnabled ? 'text-cyan-400' : 'text-slate-500'" class="w-4 h-4"></i>
                                        <span x-text="t('voiceGuidance')"></span>
                                    </span>
                                    <button @click="voiceEnabled = !voiceEnabled" 
                                            :class="voiceEnabled ? 'bg-cyan-500' : 'bg-slate-700'"
                                            class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200">
                                        <span :class="voiceEnabled ? 'translate-x-4' : 'translate-x-0'"
                                              class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200"></span>
                                    </button>
                                </div>
                            </div>
                            <!-- DYNAMIC FOCUS THEME CARD FOR WORKER -->
                            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 bg-cyan-500/10 text-cyan-400 rounded-xl border border-cyan-500/20">
                                        <i :data-lucide="getWorkerBreathingTheme().icon" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest font-mono">TEMA DEL DÍA / TODAY'S FOCUS</span>
                                        <h4 class="text-sm font-bold text-white" x-text="getWorkerBreathingTheme().title[lang]"></h4>
                                    </div>
                                </div>
                                <span class="text-xs text-slate-400 italic hidden sm:block" x-text="getWorkerBreathingTheme().subtitle[lang]"></span>
                            </div>
                            <div class="flex flex-col items-center justify-center py-4 space-y-6">
                                <!-- Breathing Visual Meter -->
                                <div class="relative flex items-center justify-center w-48 h-48">
                                    <div :class="{ 'animate-breathe bg-cyan-500/20 border-cyan-400/50': workerBreathingActive, 'bg-slate-800/30 border-slate-700': !workerBreathingActive }"
                                         class="absolute inset-0 rounded-full border-2 transition-all duration-1000"></div>
                                    <div class="z-10 text-center space-y-1">
                                        <span class="text-4xl font-black font-mono text-white tracking-tight" x-text="workerBreathingTimeLeft + 's'"></span>
                                        <p class="text-xs font-extrabold uppercase tracking-widest text-cyan-300" x-text="workerBreathingPhaseText"></p>
                                    </div>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-200 max-w-md text-center h-8 font-medium" x-text="workerBreathingInstruction"></p>
                                <div class="flex items-center gap-4">
                                    <template x-if="!workerBreathingActive">
                                        <button @click="startWorkerBreathing()"

                    adminAutoModeRunning: { es: 'Modo Auto Operando:', en: 'Auto-Mode Running:' },
                    adminAutoModeAction: { es: 'Supervisando alertas, actualizando briefs e inspeccionando logs en segundo plano.', en: 'Monitoring alerts, updating briefs, and reviewing logs automatically.' },
                    shareableLinksTitle: { es: 'Enlaces Dinámicos a Grupos (Revocación por Seguridad)', en: 'Dynamic Group Links (Access Revocation)' },
                    shareableLinksSub: { es: 'Envía estos enlaces a los grupos de trabajadores. Si un empleado se retira, revoca el enlace aquí.', en: 'Send these links to worker groups. If an employee leaves, revoke the link here.' },
                    copyLink: { es: 'Copiar Enlace', en: 'Copy Link' },
                    revokeBtn: { es: 'Revocar Link', en: 'Revoke Link' },
                    createNoticeTitle: { es: 'Publicar Nuevo Mensaje u Órden de Trabajo', en: 'Publish New Message or Work Order' },
                    pastedTextNote: { es: 'Puedes pegar cualquier longitud de texto. La app reducirá la información a los puntos clave.', en: 'You can paste any text length. The app condenses information into key bullet points.' },
                    clearOldContentBtn: { es: 'Borrar Contenido Antiguo para Continuar', en: 'Clear Old Content to Continue' },
                    targetGroupLabel: { es: 'Grupo Destinatario', en: 'Target Group' },
                    allGroups: { es: 'TODOS LOS GRUPOS DE TRABAJO', en: 'ALL WORK GROUPS' },
                    priorityLabel: { es: 'Prioridad', en: 'Priority' },
                    validityLabel: { es: 'Fecha de Expiración', en: 'Expiration Date' },
                    publishNow: { es: 'Publicar Aviso', en: 'Publish Notice' },
                    auditLogTitle: { es: 'Trazabilidad y Auditoría de Comunicados', en: 'Announcement Audit Log' },
                    auditLogSub: { es: 'Historial inalterable con autor, fecha, estado y retiradas.', en: 'Immutable history with author, date, status, and withdrawals.' },
                    withdrawBtn: { es: 'Retirar', en: 'Withdraw' },
                    archivedInLog: { es: 'Retirado (Auditado)', en: 'Withdrawn (Audited)' },
                    linkRevokedTitle: { es: 'ENLACE INACTIVADO / CADUCADO', en: 'LINK REVOKED / EXPIRED' },
                    linkRevokedDesc: { es: 'Este enlace ha sido inactivado por Jefatura. Solicita el nuevo enlace oficial a tu supervisor.', en: 'This link has been revoked by Leadership. Request the new official link from your supervisor.' }
                },
                t(k) { return this.translations[k] ? this.translations[k][this.lang] : k; },
                setLang(l) { 
                    this.lang = l; 
                    if (this.workerBreathingActive) this.stopWorkerBreathing();
                    if (this.leadershipBreathingActive) this.stopLeadershipBreathing();
                },
                async apiRequest(path, options = {}) {
                    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
                    if (this.adminAccessCode) headers['X-Admin-Code'] = this.adminAccessCode;
                    const response = await fetch(path, Object.assign({}, options, { headers }));
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.detail || 'API request failed');
                    return data;
                },
                async refreshFromServer() {
                    try {
                        const data = await this.apiRequest('/api/bootstrap?group=' + encodeURIComponent(this.currentGroupId));
                        if (Array.isArray(data.announcements)) this.announcements = data.announcements;
                        if (Array.isArray(data.daily_reminders)) this.dailyReminders = data.daily_reminders;
                        if (data.today) this.todayDateStr = data.today;
                        if (data.settings) this.adminAutoModeActive = !!data.settings.auto_mode_enabled;
                        const breathing = await this.apiRequest('/api/breathing-exercises');
                        if (Array.isArray(breathing.worker) && breathing.worker.length >= 10) this.workerBreathingThemes = breathing.worker.map(x => ({ icon: 'brain', title: x.title, subtitle: x.intro, intro: x.intro, inhale: x.inhale, exhale: x.exhale }));
                        if (Array.isArray(breathing.leadership) && breathing.leadership.length >= 10) this.leadershipAnchorsPool = breathing.leadership.map(x => ({ icon: 'brain', title: x.title, subtitle: x.intro, intro: x.intro, inhale: x.inhale, exhale: x.exhale }));
                        if (this.adminAccessCode) {
                            const adminData = await this.apiRequest('/api/admin/status');
                            if (Array.isArray(adminData.announcements)) this.announcements = adminData.announcements;
                            if (Array.isArray(adminData.schedules)) this.scheduledTasks = adminData.schedules;
                        }
                        this.$nextTick(() => lucide.createIcons());
                    } catch (err) {
                        console.warn('SmartCargo server sync:', err.message);
                    }
                },
                pickNonRepeatingWorkerExercise() {
                    const key = 'smartcargo_last_worker_exercise';
                    const last = parseInt(localStorage.getItem(key) || '-1', 10);
                    const next = (last + 1) % 10;
                    localStorage.setItem(key, String(next));
                    this.workerExerciseIndex = next;
                    this.currentWorkerExercise = this.workerBreathingThemes[next] || this.workerBreathingThemes[0];
                },
                initApp() {
                    const today = new Date();
                    this.todayDateStr = today.toISOString().split('T')[0];
                    const params = new URLSearchParams(window.location.search);
                    const grp = params.get('group');
                    if (grp && this.groups.some(g => g.id === grp)) {
                        this.currentGroupId = grp;
                    }
                    const expiry = new Date();
                    expiry.setDate(expiry.getDate() + 30);
                    this.newNotice.validUntil = expiry.toISOString().split('T')[0];
                    this.pickNonRepeatingLeadershipAnchor();
                    this.pickNonRepeatingWorkerExercise();
                    this.refreshFromServer();
                    this.apiRefreshTimer = setInterval(() => this.refreshFromServer(), 30000);
                    this.$nextTick(() => lucide.createIcons());
                },
                // EXCLUSIVE COMMAND CENTER AUTOMATION (JEFATURA ONLY)
                async toggleAdminAutoMode() {
                    if (!this.adminAuthenticated || !this.adminAccessCode) { this.showNoticeMessage(this.lang === 'es' ? 'Autoriza el acceso al servidor primero.' : 'Authenticate with the server first.'); return; }
                    try {
                        const result = await this.apiRequest('/api/admin/auto-mode', { method: 'POST', body: JSON.stringify({ enabled: !this.adminAutoModeActive }) });
                        this.adminAutoModeActive = !!result.enabled;
                        this.showNoticeMessage(this.adminAutoModeActive ? (this.lang === 'es' ? 'Modo Auto activado en el servidor.' : 'Server Auto Mode enabled.') : (this.lang === 'es' ? 'Modo Auto desactivado en el servidor.' : 'Server Auto Mode disabled.'));
                    } catch (err) { this.showNoticeMessage((this.lang === 'es' ? 'No se pudo cambiar el modo Auto: ' : 'Could not change Auto Mode: ') + err.message); }
                },
                startAdminAutoRoutine() { /* Scheduling is handled by the Render server, not by a browser timer. */ },
                switchWorkerGroup(grpId) {
                    this.currentGroupId = grpId;
                    this.dailyReminders = [];
                    this.showVictoryReward = false;
                    this.refreshFromServer();
                    this.$nextTick(() => lucide.createIcons());
                },
                getCurrentGroup() {
                    return this.groups.find(g => g.id === this.currentGroupId) || this.groups[0];
                },
                getDailyRotatedReminders() {
                    if (this.dailyReminders.length === 3) return this.dailyReminders;
                    const pool = this.remindersPool[this.currentGroupId] || [];
                    if (pool.length === 0) return [];
                    let seed = 0; for (let i = 0; i < this.todayDateStr.length; i++) seed += this.todayDateStr.charCodeAt(i);
                    const picked = []; for (let i = 0; i < Math.min(3, pool.length); i++) picked.push(pool[(seed + i * 7) % pool.length]);
                    return picked;
                },
                getActiveAnnouncements() {
                    return this.announcements.filter(a => {
                        const isTarget = a.targetGroup === 'ALL' || a.targetGroup === this.currentGroupId;
                        return a.status === 'Active' && isTarget;
                    });
                },
                getTargetDisplay(grpCode) {
                    if (grpCode === 'ALL') return this.lang === 'es' ? 'TODOS' : 'ALL';
                    const g = this.groups.find(x => x.id === grpCode);
                    return g ? g.name[this.lang] : grpCode;
                },
                formatDate(isoStr) {
                    if (!isoStr) return '';
                    const d = new Date(isoStr);
                    return d.toLocaleDateString(this.lang === 'es' ? 'es-ES' : 'en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                },
                getWorkerBreathingTheme() { return this.currentWorkerExercise && this.currentWorkerExercise.title ? this.currentWorkerExercise : this.workerBreathingThemes[0]; },
                getDailyVictoryAffirmation() {
                    let seed = 0;
                    for (let i = 0; i < this.todayDateStr.length; i++) seed += this.todayDateStr.charCodeAt(i);
                    return this.victoryAffirmations[seed % this.victoryAffirmations.length];
                },
                // WORKER BREATHING (45 SECONDS; UNIQUE VOICE CUE EVERY 4 SECONDS)
                getWorkerBreathingCues() {
                    return this.lang === 'es' ? [
                        'Toma aire con suavidad.', 'Suelta el aire sin prisa.',
                        'Deja que el círculo crezca.', 'Permite que el círculo se cierre.',
                        'Inhala y observa tu entorno.', 'Exhala y afloja los hombros.',
                        'Expande el círculo lentamente.', 'Reduce el círculo con calma.',
                        'Respira y centra tu atención.', 'Suelta el aire de forma natural.',
                        'Acompaña la expansión del círculo.', 'Acompaña el cierre sin esfuerzo.'
                    ] : [
                        'Breathe in gently.', 'Breathe out without rushing.',
                        'Let the circle expand.', 'Let the circle contract.',
                        'Inhale and notice your surroundings.', 'Exhale and relax your shoulders.',
                        'Expand the circle slowly.', 'Let the circle soften inward.',
                        'Breathe and focus your attention.', 'Release the air naturally.',
                        'Follow the circle as it expands.', 'Follow the circle as it contracts.'
                    ];
                },
                startWorkerBreathing() {
                    clearInterval(this.workerBreathingTimer);
                    this.pickNonRepeatingWorkerExercise();
                    this.workerBreathingActive = true;
                    this.workerBreathingTimeLeft = 45;
                    this.showVictoryReward = false;
                    this.updateWorkerBreathingPhase();
                    this.workerBreathingTimer = setInterval(() => {
                        this.workerBreathingTimeLeft--;
                        const elapsed = 45 - this.workerBreathingTimeLeft;
                        if (elapsed % 4 === 0) this.updateWorkerBreathingPhase();
                        if (this.workerBreathingTimeLeft <= 0) this.finishWorkerBreathing();
                    }, 1000);
                },
                updateWorkerBreathingPhase() {
                    const elapsed = 45 - this.workerBreathingTimeLeft;
                    const cues = this.getWorkerBreathingCues();
                    const cueIndex = Math.min(Math.floor(elapsed / 4), cues.length - 1);
                    const inhale = (elapsed % 8) < 4;
                    this.workerBreathingPhaseText = inhale
                        ? (this.lang === 'es' ? 'INHALA Y ENFÓCATE' : 'INHALE & FOCUS')
                        : (this.lang === 'es' ? 'EXHALA TENSIONES' : 'EXHALE TENSION');
                    this.workerBreathingInstruction = cues[cueIndex];
                    if (this.voiceEnabled) this.speakVoice(this.workerBreathingInstruction);
                },
                stopWorkerBreathing() {
                    this.workerBreathingActive = false;
                    clearInterval(this.workerBreathingTimer);
                    this.workerBreathingTimeLeft = 45;
                    this.workerBreathingPhaseText = 'Pausa';
                    this.workerBreathingInstruction = this.lang === 'es' ? 'Ejercicio pausado.' : 'Exercise paused.';
                },
                finishWorkerBreathing() {
                    this.stopWorkerBreathing();
                    this.showVictoryReward = true;
                    const aff = this.getDailyVictoryAffirmation()[this.lang];
                    if (this.voiceEnabled) this.speakVoice(this.lang === 'es' ? '¡Excelente trabajo! ' + aff : 'Great job! ' + aff);
                },
                // LEADERSHIP BREATHING (60 SECONDS; UNIQUE VOICE CUE EVERY 4 SECONDS)
                getLeadershipBreathingCues() {
                    return this.lang === 'es' ? [
                        'Inhala y ordena tus prioridades.', 'Exhala y libera la tensión.',
                        'Deja que el círculo se expanda.', 'Permite que vuelva suavemente.',
                        'Inhala y observa los hechos.', 'Exhala y deja atrás la prisa.',
                        'Expande el círculo con calma.', 'Cierra el círculo sin esfuerzo.',
                        'Inhala y escucha con atención.', 'Exhala antes de responder.',
                        'Acompaña el crecimiento del círculo.', 'Acompaña su regreso con calma.',
                        'Inhala y enfoca la decisión.', 'Exhala y conserva la perspectiva.',
                        'Respira y retoma el control sereno.'
                    ] : [
                        'Inhale and order your priorities.', 'Exhale and release tension.',
                        'Let the circle expand.', 'Allow it to return gently.',
                        'Inhale and observe the facts.', 'Exhale and leave haste behind.',
                        'Expand the circle calmly.', 'Let the circle close effortlessly.',
                        'Inhale and listen carefully.', 'Exhale before you respond.',
                        'Follow the circle as it grows.', 'Follow its return calmly.',
                        'Inhale and focus on the decision.', 'Exhale and keep perspective.',
                        'Breathe and regain calm control.'
                    ];
                },
                pickNonRepeatingLeadershipAnchor() {
                    const lastIdx = parseInt(localStorage.getItem('smartcargo_last_lead_anchor') || '-1');
                    const nextIdx = (lastIdx + 1) % this.leadershipAnchorsPool.length;
                    localStorage.setItem('smartcargo_last_lead_anchor', nextIdx.toString());
                    this.currentLeadershipAnchor = this.leadershipAnchorsPool[nextIdx];
                },
                startLeadershipBreathing() {
                    clearInterval(this.leadershipTimer);
                    this.pickNonRepeatingLeadershipAnchor();
                    this.leadershipBreathingActive = true;
                    this.leadershipTimeLeft = 60;
                    this.updateLeadershipBreathingPhase();
                    this.leadershipTimer = setInterval(() => {
                        this.leadershipTimeLeft--;
                        const elapsed = 60 - this.leadershipTimeLeft;
                        if (elapsed % 4 === 0) this.updateLeadershipBreathingPhase();
                        if (this.leadershipTimeLeft <= 0) this.finishLeadershipBreathing();
                    }, 1000);
                },
                updateLeadershipBreathingPhase() {
                    const elapsed = 60 - this.leadershipTimeLeft;
                    const cues = this.getLeadershipBreathingCues();
                    const cueIndex = Math.min(Math.floor(elapsed / 4), cues.length - 1);
                    const inhale = (elapsed % 8) < 4;
                    this.leadershipPhaseText = inhale
                        ? (this.lang === 'es' ? 'INHALA Y CONTROLA' : 'INHALE & CONTROL')
                        : (this.lang === 'es' ? 'EXHALA PRESIÓN' : 'EXHALE PRESSURE');
                    this.leadershipInstruction = cues[cueIndex];
                    this.speakVoice(this.leadershipInstruction);
                },
                stopLeadershipBreathing() {
                    this.leadershipBreathingActive = false;
                    clearInterval(this.leadershipTimer);
                    this.leadershipTimeLeft = 60;
                    this.leadershipPhaseText = 'Pausa';
                    this.leadershipInstruction = this.lang === 'es' ? 'Sesión finalizada.' : 'Session ended.';
                },
                finishLeadershipBreathing() {
                    this.stopLeadershipBreathing();
                    this.showNoticeMessage(this.lang === 'es' ? '¡Sesión de Liderazgo completada! Mente despejada para el control operativo.' : 'Leadership session completed! Clear mind for operations.');
                },
                speakVoice(text) {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = this.lang === 'es' ? 'es-ES' : 'en-US';
                        utterance.rate = 0.95;
                        window.speechSynthesis.speak(utterance);
                    }
                },
                toggleAdminView() {
                    this.viewMode = 'admin';
                    this.$nextTick(() => lucide.createIcons());
                },
                async authenticateAdmin() {
                    try {
                        const result = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.adminPasscode }) });
                        const data = await result.json().catch(() => ({}));
                        if (!result.ok || !data.ok) throw new Error(data.detail || 'Invalid code');
                        this.adminAccessCode = this.adminPasscode;
                        this.adminPasscode = '';
                        this.adminAuthenticated = true;
                        this.adminError = '';
                        await this.refreshFromServer();
                    } catch (err) {
                        this.adminAuthenticated = false;
                        this.adminError = this.lang === 'es' ? 'Clave incorrecta o servidor no disponible.' : 'Invalid code or server unavailable.';
                    }
                    this.$nextTick(() => lucide.createIcons());
                },
                getGroupToken(grpId) {
                    return this.groupTokens[grpId] || 'TOK-DEFAULT';
                },
                isGroupLinkRevoked(grpId) {
                    const tok = this.getGroupToken(grpId);
                    return this.revokedTokens.includes(tok);
                },
                isCurrentLinkRevoked() {
                    return this.isGroupLinkRevoked(this.currentGroupId);
                },
                revokeAndRegenerateLink(grpId) {
                    const oldToken = this.getGroupToken(grpId);
                    this.revokedTokens.push(oldToken);
                    const newToken = 'TOK-' + grpId + '-' + Math.floor(1000 + Math.random() * 9000);
                    this.groupTokens[grpId] = newToken;
                    this.showNoticeMessage(this.lang === 'es' 
                        ? '¡Enlace anterior inactivado! El trabajador saliente no podrá volver a acceder. Nuevo token generado: ' + newToken
                        : 'Old link revoked! Departing worker loses access immediately. New token generated: ' + newToken);
                },
                copyGroupLink(grpId) {
                    const tok = this.getGroupToken(grpId);
                    const url = window.location.origin + window.location.pathname + '?group=' + grpId + '&token=' + tok;
                    const tempInput = document.createElement('input');
                    tempInput.value = url;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    this.showNoticeMessage(this.lang === 'es' ? 'Enlace oficial copiado para ' + grpId + ':\n' + url : 'Official link copied for ' + grpId + ':\n' + url);
                },
                showNoticeMessage(msg) {
                    const div = document.createElement('div');
                    div.className = 'fixed bottom-4 right-4 z-50 bg-slate-900 border border-brand-500 text-white text-xs px-4 py-3 rounded-xl shadow-2xl max-w-sm font-mono';
                    div.innerText = msg;
                    document.body.appendChild(div);
                    setTimeout(() => div.remove(), 4000);
                },
                clearFormWithWarning() {
                    this.newNotice.titleEs = '';
                    this.newNotice.contentEs = '';
                    this.newNotice.titleEn = '';
                    this.newNotice.contentEn = '';
                },
                generateSmartBullets(rawText, language) {
                    if (!rawText) return language === 'es' ? ['Seguir instrucciones operativas estándar.'] : ['Follow standard operational instructions.'];
                    const cleanSentences = rawText
                        .split(/[.\n]/)
                        .map(s => s.trim())
                        .filter(s => s.length > 5);
                    if (cleanSentences.length === 0) {
                        return [rawText.substring(0, 80) + '...'];
                    }
                    return cleanSentences.slice(0, 3);
                },
                async publishAnnouncement() {
                    const hasEs = !!(this.newNotice.titleEs.trim() && this.newNotice.contentEs.trim());
                    const hasEn = !!(this.newNotice.titleEn.trim() && this.newNotice.contentEn.trim());
                    if (!hasEs && !hasEn) { this.showNoticeMessage(this.lang === 'es' ? 'Completa título y mensaje en español o en inglés.' : 'Enter a title and message in Spanish or English.'); return; }
                    if (!this.newNotice.authorName.trim() || !this.newNotice.authorRole.trim()) { this.showNoticeMessage(this.lang === 'es' ? 'Indica nombre, apellido y cargo autorizado.' : 'Enter full name and authorized role.'); return; }
                    if (this.newNotice.priority === 'High' && this.newNotice.recurrence !== 'once') { this.showNoticeMessage(this.lang === 'es' ? 'Los avisos urgentes no pueden repetirse automáticamente.' : 'Urgent notices cannot recur automatically.'); return; }
                    if (this.newNotice.recurrence !== 'once' && !this.newNotice.generalAutoApproved) { this.showNoticeMessage(this.lang === 'es' ? 'La repetición exige autorizar el aviso general.' : 'Recurring publication requires approval as a general notice.'); return; }
                    if (this.newNotice.recurrence !== 'once' && this.newNotice.targetGroup !== 'ALL') { this.showNoticeMessage(this.lang === 'es' ? 'La repetición automática solo se permite para avisos generales dirigidos a TODOS.' : 'Automatic recurrence is only allowed for general notices addressed to ALL.'); return; }
                    try {
                        const payload = {
                            targetGroup: this.newNotice.targetGroup, priority: this.newNotice.priority,
                            validUntil: this.newNotice.validUntil || '',
                            titleEs: this.newNotice.titleEs.trim(), contentEs: this.newNotice.contentEs.trim(),
                            titleEn: this.newNotice.titleEn.trim(), contentEn: this.newNotice.contentEn.trim(),
                            publishTiming: this.newNotice.publishTiming, scheduledAt: this.newNotice.scheduledAt,
                            recurrence: this.newNotice.recurrence, authorName: this.newNotice.authorName.trim(),
                            authorRole: this.newNotice.authorRole.trim(), generalAutoApproved: !!this.newNotice.generalAutoApproved
                        };
                        const result = await this.apiRequest('/api/admin/announcements', { method: 'POST', body: JSON.stringify(payload) });
                        await this.refreshFromServer();
                        this.newNotice.titleEs = ''; this.newNotice.contentEs = ''; this.newNotice.titleEn = ''; this.newNotice.contentEn = '';
                        this.newNotice.scheduledAt = ''; this.newNotice.publishTiming = 'now'; this.newNotice.recurrence = 'once'; this.newNotice.generalAutoApproved = false;
                        this.showNoticeMessage(result.message || (this.lang === 'es' ? 'Contenido procesado por el servidor.' : 'Content processed by server.'));
                    } catch (err) { this.showNoticeMessage((this.lang === 'es' ? 'No se pudo publicar: ' : 'Publication failed: ') + err.message); }
                    this.$nextTick(() => lucide.createIcons());
                },
                async withdrawNotice(id) {
                    try { await this.apiRequest('/api/admin/announcements/' + encodeURIComponent(id) + '/withdraw', { method: 'POST', body: JSON.stringify({}) }); await this.refreshFromServer(); this.showNoticeMessage(this.lang === 'es' ? 'Aviso retirado en el servidor.' : 'Notice withdrawn on server.'); }
                    catch (err) { this.showNoticeMessage((this.lang === 'es' ? 'No se pudo retirar: ' : 'Could not withdraw: ') + err.message); }
                }
            }
        }
    </script>
</body>
</html>
