<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCargo SafetyHub | Air Cargo Operational Safety & Control Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49' },
                        safety: { amber: '#f59e0b', orange: '#f97316', red: '#ef4444', green: '#10b981' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @keyframes breathePulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.35); opacity: 1; } }
        .animate-breathe { animation: breathePulse 8s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 selection:bg-brand-500 selection:text-white" x-data="safetyApp()" x-init="initApp()">
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-brand-600 via-blue-600 to-amber-500 rounded-xl shadow-lg text-white">
                    <i data-lucide="plane-takeoff" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-black text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">SMARTCARGO</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold tracking-widest uppercase">SAFETYHUB</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-medium hidden sm:block" x-text="t('appSubtitle')"></p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2 sm:gap-3">
                <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex items-center">
                    <button @click="setLang('es')" :class="lang === 'es' ? 'bg-brand-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 text-xs rounded-md transition-all">ES</button>
                    <button @click="setLang('en')" :class="lang === 'en' ? 'bg-brand-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1 text-xs rounded-md transition-all">EN</button>
                </div>
                <div class="bg-slate-800/80 p-1 rounded-lg border border-slate-700 flex items-center">
                    <button @click="viewMode = 'worker'" :class="viewMode === 'worker' ? 'bg-slate-700 text-white font-semibold' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 text-xs rounded-md flex items-center gap-1.5 transition-all">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i><span x-text="t('workerMode')"></span>
                    </button>
                    <button @click="toggleAdminView()" :class="viewMode === 'admin' ? 'bg-amber-600 text-white font-semibold shadow-lg' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 text-xs rounded-md flex items-center gap-1.5 transition-all">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i><span x-text="t('adminMode')"></span>
                    </button>
                </div>
            </div>
        </div>
        <template x-if="viewMode === 'worker'">
            <div class="max-w-7xl mx-auto mt-3 pt-2 border-t border-slate-800 flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                <span class="text-[11px] text-slate-400 font-bold uppercase tracking-wider shrink-0 flex items-center gap-1">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-amber-400"></i><span x-text="t('selectGroupLabel') + ':'"></span>
                </span>
                <template x-for="group in groups" :key="group.id">
                    <button @click="switchWorkerGroup(group.id)" :class="currentGroupId === group.id ? 'bg-brand-500/20 border-brand-500 text-brand-300 font-bold shadow' : 'bg-slate-800/60 border-slate-700/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'" class="px-3 py-1 text-xs rounded-full border transition-all shrink-0 flex items-center gap-1.5">
                        <i :data-lucide="group.icon" class="w-3.5 h-3.5"></i><span x-text="group.name[lang]"></span>
                    </button>
                </template>
            </div>
        </template>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-8">
        <div class="bg-gradient-to-r from-amber-950/50 via-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div class="flex items-start gap-3">
                <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-xl shrink-0 mt-0.5 border border-amber-500/20">
                    <i data-lucide="shield-ban" class="w-5 h-5"></i>
                </div>
                <div class="text-xs text-slate-300 space-y-1">
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold text-amber-400 tracking-wide uppercase" x-text="t('complianceTitle')"></span>
                        <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.2 rounded font-mono">CONFIDENTIALITY RULE</span>
                    </div>
                    <p x-text="t('complianceWarning')"></p>
                    <p class="text-slate-400 italic text-[11px]" x-text="t('complianceDisclaimer')"></p>
                </div>
            </div>
            <div class="shrink-0 text-right">
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[11px] text-slate-300 font-mono">
                    <i data-lucide="lock" class="w-3.5 h-3.5 text-emerald-400"></i><span x-text="t('dataProtected')"></span>
                </span>
            </div>
        </div>

        <!-- WORKER VIEW -->
        <template x-if="viewMode === 'worker'">
            <div class="space-y-8">
                <template x-if="isCurrentLinkRevoked()">
                    <div class="bg-rose-950/40 border-2 border-rose-600 rounded-2xl p-8 text-center space-y-4 max-w-xl mx-auto shadow-2xl">
                        <div class="w-16 h-16 bg-rose-600/20 text-rose-400 rounded-full flex items-center justify-center mx-auto border border-rose-500/30">
                            <i data-lucide="link-2-off" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white" x-text="t('linkRevokedTitle')"></h2>
                        <p class="text-sm text-slate-300" x-text="t('linkRevokedDesc')"></p>
                        <div class="p-3 bg-slate-900 rounded-xl text-xs text-slate-400 font-mono border border-slate-800">
                            Token: <span class="text-rose-400 font-bold" x-text="getGroupToken(currentGroupId)"></span> (Revoked / Expired)
                        </div>
                    </div>
                </template>

                <template x-if="!isCurrentLinkRevoked()">
                    <div class="space-y-8">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                            <div class="absolute right-0 top-0 bottom-0 w-64 bg-gradient-to-l from-brand-600/10 via-brand-500/5 to-transparent pointer-events-none"></div>
                            <div class="flex items-center gap-4 z-10">
                                <div class="p-4 bg-brand-500/10 border border-brand-500/30 text-brand-400 rounded-2xl shadow-inner">
                                    <i :data-lucide="getCurrentGroup().icon" class="w-8 h-8"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest" x-text="t('groupStation')"></span>
                                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono border border-slate-700" x-text="todayDateStr"></span>
                                    </div>
                                    <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight mt-0.5" x-text="getCurrentGroup().name[lang]"></h1>
                                </div>
                            </div>
                            <div class="mt-4 sm:mt-0 text-xs text-slate-300 flex items-center gap-2 bg-slate-950/80 px-3.5 py-2 rounded-xl border border-slate-800 z-10 shadow">
                                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                                <span x-text="t('activeBriefingSession')"></span>
                            </div>
                        </div>

                        <!-- SECTION 1: PERMANENT PILLARS -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="shield" class="w-5 h-5 text-brand-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('pillarsHeader')"></h2>
                                </div>
                                <span class="text-[11px] bg-brand-900/60 text-brand-300 border border-brand-700/50 px-2.5 py-0.5 rounded-full font-mono">Standard SMS</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-blue-500 border border-slate-800 rounded-xl p-5 shadow-lg">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest font-mono">PILAR 01</span>
                                        <i data-lucide="user-shield" class="w-5 h-5 text-blue-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p1.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p1.desc[lang]"></p>
                                </div>
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-amber-500 border border-slate-800 rounded-xl p-5 shadow-lg">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-amber-400 uppercase tracking-widest font-mono">PILAR 02</span>
                                        <i data-lucide="eye" class="w-5 h-5 text-amber-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p2.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p2.desc[lang]"></p>
                                </div>
                                <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border-l-4 border-l-emerald-500 border border-slate-800 rounded-xl p-5 shadow-lg">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest font-mono">PILAR 03</span>
                                        <i data-lucide="users" class="w-5 h-5 text-emerald-400"></i>
                                    </div>
                                    <h3 class="text-base font-black text-white mb-2" x-text="pillars.p3.title[lang]"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="pillars.p3.desc[lang]"></p>
                                </div>
                            </div>
                        </section>

                        <!-- SECTION 2: DAILY REMINDERS -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="calendar-check" class="w-5 h-5 text-amber-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('remindersHeader')"></h2>
                                </div>
                                <span class="text-xs text-amber-400/90 flex items-center gap-1 font-mono font-bold bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20">
                                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                                    <span x-text="t('dailyRotationLabel')"></span>
                                </span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <template x-for="(rem, idx) in getDailyRotatedReminders()" :key="rem.id">
                                    <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-3">
                                        <div class="space-y-2">
                                            <div class="flex items-center justify-between text-xs">
                                                <span class="font-mono text-amber-400 font-bold" x-text="'#' + (idx + 1) + ' ' + getCurrentGroup().name[lang].toUpperCase()"></span>
                                                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                                            </div>
                                            <h4 class="font-bold text-white text-sm" x-text="rem.title[lang]"></h4>
                                            <p class="text-xs text-slate-300 leading-relaxed" x-text="rem.desc[lang]"></p>
                                        </div>
                                        <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-400 font-mono">
                                            <span x-text="t('verifiedStandard')"></span>
                                            <span class="text-slate-500" x-text="'ID: ' + rem.id"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>

                        <!-- SECTION 3: ANNOUNCEMENTS & NOTICES -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="megaphone" class="w-5 h-5 text-rose-400"></i>
                                    <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('announcementsHeader')"></h2>
                                </div>
                                <span class="text-xs text-slate-400" x-text="getActiveAnnouncements().length + ' ' + t('activeNotices')"></span>
                            </div>
                            <div class="space-y-4">
                                <template x-if="getActiveAnnouncements().length === 0">
                                    <div class="bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl p-8 text-center text-slate-400 space-y-2">
                                        <i data-lucide="check-check" class="w-8 h-8 mx-auto text-emerald-500"></i>
                                        <p class="text-sm font-semibold text-slate-300" x-text="t('noActiveNotices')"></p>
                                    </div>
                                </template>
                                <template x-for="item in getActiveAnnouncements()" :key="item.id">
                                    <div :class="item.priority === 'High' ? 'border-l-rose-500 bg-rose-950/20' : 'border-l-brand-500 bg-slate-900'" class="border-l-4 border-t border-r border-b border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <div class="flex items-center gap-2">
                                                <span :class="item.priority === 'High' ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' : 'bg-brand-500/20 text-brand-300 border-brand-500/30'" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border" x-text="item.priority"></span>
                                                <template x-if="item.priority === 'High'">
                                                    <span class="px-2 py-0.5 rounded bg-rose-600 text-white font-bold text-[10px] tracking-widest uppercase flex items-center gap-1 animate-pulse">
                                                        <i data-lucide="alert-triangle" class="w-3 h-3"></i> URGENTE / URGENT
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="text-[11px] text-slate-400 flex items-center gap-3 font-mono">
                                                <span><i data-lucide="user" class="w-3 h-3 inline mr-1"></i><span x-text="item.author + (item.authorRole ? ' · ' + item.authorRole : '')"></span></span>
                                                <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i><span x-text="formatDate(item.createdAt)"></span></span>
                                            </div>
                                        </div>
                                        <h3 class="text-lg font-black text-white" x-text="item.title[lang] || item.title.es || item.title.en"></h3>
                                        <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-4 space-y-2">
                                            <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-line" x-text="item.content[lang] || item.content.es || item.content.en"></p>
                                        </div>
                                        <div class="pt-2 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                                            <span x-text="t('targetGroup') + ': ' + getTargetDisplay(item.targetGroup)"></span>
                                            <span x-text="'Valid until: ' + item.validUntil"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>

                        <!-- SECTION 4: WORKER BREATHING -->
                        <section class="bg-gradient-to-br from-slate-900 via-slate-900 to-brand-950/50 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="heart-pulse" class="w-5 h-5 text-cyan-400"></i>
                                        <h2 class="text-base font-extrabold text-white uppercase tracking-wider" x-text="t('breathingTitleWorker')"></h2>
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1" x-text="t('breathingSubtitleWorker')"></p>
                                </div>
                                <div class="flex items-center gap-3 bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl">
                                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                                        <i :data-lucide="voiceEnabled ? 'volume-2' : 'volume-x'" :class="voiceEnabled ? 'text-cyan-400' : 'text-slate-500'" class="w-4 h-4"></i>
                                        <span x-text="t('voiceGuidance')"></span>
                                    </span>
                                    <button @click="voiceEnabled = !voiceEnabled" :class="voiceEnabled ? 'bg-cyan-500' : 'bg-slate-700'" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200">
                                        <span :class="voiceEnabled ? 'translate-x-4' : 'translate-x-0'" class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 bg-cyan-500/10 text-cyan-400 rounded-xl border border-cyan-500/20">
                                        <i :data-lucide="getWorkerBreathingTheme().icon" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest font-mono">TEMA DEL DÍA / TODAY'S FOCUS</span>
                                        <h4 class="text-sm font-bold text-white" x-text="getWorkerBreathingTheme().title[lang]"></h4>
                                    </div>
                                </div>
                                <span class="text-xs text-slate-400 italic hidden sm:block" x-text="getWorkerBreathingTheme().subtitle[lang]"></span>
                            </div>
                            <div class="flex flex-col items-center justify-center py-4 space-y-6">
                                <div class="relative flex items-center justify-center w-48 h-48">
                                    <div :class="{ 'animate-breathe bg-cyan-500/20 border-cyan-400/50': workerBreathingActive, 'bg-slate-800/30 border-slate-700': !workerBreathingActive }" class="absolute inset-0 rounded-full border-2 transition-all duration-1000"></div>
                                    <div class="z-10 text-center space-y-1">
                                        <span class="text-4xl font-black font-mono text-white tracking-tight" x-text="workerBreathingTimeLeft + 's'"></span>
                                        <p class="text-xs font-extrabold uppercase tracking-widest text-cyan-300" x-text="workerBreathingPhaseText"></p>
                                    </div>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-200 max-w-md text-center h-8 font-medium" x-text="workerBreathingInstruction"></p>
                                <div class="flex items-center gap-4">
                                    <template x-if="!workerBreathingActive">
                                        <button @click="startWorkerBreathing()" class="px-6 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase tracking-wider shadow-lg flex items-center gap-2 transition-all active:scale-95">
                                            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                                            <span x-text="t('startWorkerBreathingBtn')"></span>
                                        </button>
                                    </template>
                                    <template x-if="workerBreathingActive">
                                        <button @click="stopWorkerBreathing()" class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg flex items-center gap-2 transition-all active:scale-95">
                                            <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                                            <span x-text="t('stopBreathing')"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <template x-if="showVictoryReward">
                                <div class="bg-gradient-to-r from-amber-500/20 via-emerald-500/20 to-brand-500/20 border border-emerald-500/40 rounded-xl p-4 text-center space-y-2 animate-bounce">
                                    <div class="inline-flex items-center justify-center p-2 bg-emerald-500 text-slate-950 rounded-full font-bold text-xs">
                                        <i data-lucide="trophy" class="w-4 h-4"></i>
                                    </div>
                                    <h4 class="text-sm font-black text-emerald-300 uppercase tracking-wide" x-text="t('victoryTitle')"></h4>
                                    <p class="text-xs text-white font-semibold" x-text="getDailyVictoryAffirmation()[lang]"></p>
                                </div>
                            </template>
                        </section>
                    </div>
                </template>
            </div>
        </template>

        <!-- COMMAND CENTER (ADMIN VIEW) -->
        <template x-if="viewMode === 'admin'">
            <div class="space-y-8">
                <template x-if="!adminAuthenticated">
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                        <div class="text-center space-y-2">
                            <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto border border-amber-500/20">
                                <i data-lucide="lock" class="w-6 h-6"></i>
                            </div>
                            <h2 class="text-lg font-bold text-white" x-text="t('adminAccessTitle')"></h2>
                            <p class="text-xs text-slate-400" x-text="t('adminAccessSubtitle')"></p>
                        </div>
                        <form @submit.prevent="authenticateAdmin()" class="space-y-4">

                t(k) { return this.translations[k] ? this.translations[k][this.lang] : k; },
                setLang(l) { this.lang = l; },
                initApp() {
                    const today = new Date();
                    this.todayDateStr = today.toISOString().split('T')[0];
                    const expiry = new Date();
                    expiry.setDate(expiry.getDate() + 30);
                    this.newNotice.validUntil = expiry.toISOString().split('T')[0];
                    const saved = localStorage.getItem('smartcargo_announcements_local');
                    if (saved) {
                        try { this.announcements = JSON.parse(saved); } catch (e) { this.announcements = []; }
                    }
                    this.currentLeadershipAnchor = this.leadershipAnchorsPool[0];
                    this.currentWorkerExercise = this.workerBreathingThemes[0];
                    this.$nextTick(() => lucide.createIcons());
                },
                toggleAdminView() { this.viewMode = 'admin'; this.$nextTick(() => lucide.createIcons()); },
                authenticateAdmin() {
                    if (this.adminPasscode === '1234' || this.adminPasscode === 'admin' || this.adminPasscode === '2026') {
                        this.adminAuthenticated = true;
                        this.adminError = '';
                    } else {
                        this.adminError = this.lang === 'es' ? 'Clave incorrecta' : 'Invalid passcode';
                    }
                },
                toggleAdminAutoMode() { this.adminAutoModeActive = !this.adminAutoModeActive; },
                switchWorkerGroup(grpId) { this.currentGroupId = grpId; this.$nextTick(() => lucide.createIcons()); },
                getCurrentGroup() { return this.groups.find(g => g.id === this.currentGroupId) || this.groups[0]; },
                getDailyRotatedReminders() {
                    const pool = this.remindersPool[this.currentGroupId] || [];
                    return pool.slice(0, 3);
                },
                getActiveAnnouncements() {
                    const today = new Date().toISOString().split('T')[0];
                    return this.announcements.filter(a => {
                        if (a.status !== 'Active') return false;
                        const targetMatch = a.targetGroup === 'ALL' || a.targetGroup === this.currentGroupId;
                        if (!targetMatch) return false;
                        if (a.validUntil && a.validUntil < today) return false;
                        return true;
                    });
                },
                getTargetDisplay(grpCode) {
                    if (grpCode === 'ALL') return this.lang === 'es' ? 'TODOS (6 CANALES)' : 'ALL (6 CHANNELS)';
                    const g = this.groups.find(x => x.id === grpCode);
                    return g ? g.name[this.lang] : grpCode;
                },
                formatDate(isoStr) {
                    if (!isoStr) return '';
                    return isoStr;
                },
                getWorkerBreathingTheme() { return this.currentWorkerExercise; },
                getDailyVictoryAffirmation() { return this.victoryAffirmations[0]; },
                startWorkerBreathing() {
                    this.workerBreathingActive = true;
                    this.workerBreathingTimeLeft = 45;
                    this.workerBreathingInstruction = 'Inhala profundamente...';
                    this.workerBreathingTimer = setInterval(() => {
                        this.workerBreathingTimeLeft--;
                        if (this.workerBreathingTimeLeft <= 0) {
                            clearInterval(this.workerBreathingTimer);
                            this.workerBreathingActive = false;
                            this.showVictoryReward = true;
                        }
                    }, 1000);
                },
                stopWorkerBreathing() {
                    clearInterval(this.workerBreathingTimer);
                    this.workerBreathingActive = false;
                    this.workerBreathingTimeLeft = 45;
                },
                startLeadershipBreathing() {
                    this.leadershipBreathingActive = true;
                    this.leadershipTimeLeft = 60;
                    this.leadershipInstruction = 'Mantén el control y concéntrate en tus prioridades...';
                    this.leadershipTimer = setInterval(() => {
                        this.leadershipTimeLeft--;
                        if (this.leadershipTimeLeft <= 0) {
                            clearInterval(this.leadershipTimer);
                            this.leadershipBreathingActive = false;
                        }
                    }, 1000);
                },
                stopLeadershipBreathing() {
                    clearInterval(this.leadershipTimer);
                    this.leadershipBreathingActive = false;
                    this.leadershipTimeLeft = 60;
                },
                getGroupToken(grpId) { return this.groupTokens[grpId] || 'TOK-DEFAULT'; },
                isGroupLinkRevoked(grpId) { return this.revokedTokens.includes(this.getGroupToken(grpId)); },
                isCurrentLinkRevoked() { return this.isGroupLinkRevoked(this.currentGroupId); },
                revokeAndRegenerateLink(grpId) {
                    const oldToken = this.getGroupToken(grpId);
                    this.revokedTokens.push(oldToken);
                    const newToken = 'TOK-' + grpId + '-' + Math.floor(1000 + Math.random() * 9000);
                    this.groupTokens[grpId] = newToken;
                },
                copyGroupLink(grpId) {
                    const url = window.location.origin + window.location.pathname + '?group=' + grpId;
                    navigator.clipboard.writeText(url);
                    alert(this.lang === 'es' ? 'Enlace copiado al portapapeles' : 'Link copied to clipboard');
                },
                clearFormWithWarning() {
                    this.newNotice.titleEs = '';
                    this.newNotice.contentEs = '';
                    this.newNotice.titleEn = '';
                    this.newNotice.contentEn = '';
                    this.newNotice.authorName = '';
                    this.newNotice.authorRole = '';
                    this.newNotice.targetGroup = 'ALL';
                    this.newNotice.priority = 'Normal';
                    this.newNotice.publishTiming = 'now';
                    this.newNotice.scheduledAt = '';
                    this.newNotice.recurrence = 'once';
                    this.newNotice.generalAutoApproved = false;
                    const expiry = new Date();
                    expiry.setDate(expiry.getDate() + 30);
                    this.newNotice.validUntil = expiry.toISOString().split('T')[0];
                },
                countSentences(text) {
                    if (!text || !text.trim()) return 0;
                    const matches = text.trim().match(/[^.!?]+[.!?]+/g);
                    if (!matches) return text.trim().length > 0 ? 1 : 0;
                    return matches.length;
                },
                publishAnnouncement() {
                    const hasEs = !!(this.newNotice.titleEs.trim() && this.newNotice.contentEs.trim());
                    const hasEn = !!(this.newNotice.titleEn.trim() && this.newNotice.contentEn.trim());
                    if (!hasEs && !hasEn) {
                        alert(this.lang === 'es' ? 'Debes ingresar un título y contenido en al menos un idioma.' : 'Must provide title and content in at least one language.');
                        return;
                    }
                    const sentencesEs = this.countSentences(this.newNotice.contentEs);
                    const sentencesEn = this.countSentences(this.newNotice.contentEn);
                    if (sentencesEs > 10 || sentencesEn > 10) {
                        alert(this.lang === 'es' ? 'Se prohíbe exceder las 10 oraciones por mensaje.' : 'Exceeding 10 sentences per message is prohibited.');
                        return;
                    }

                    const todayStr = new Date().toISOString().split('T')[0];
                    const newEntry = {
                        id: 'ANC-' + Date.now().toString().slice(-4),
                        createdAt: todayStr,
                        targetGroup: this.newNotice.targetGroup,
                        priority: this.newNotice.priority,
                        validUntil: this.newNotice.validUntil || '2026-12-31',
                        status: 'Active',
                        author: this.newNotice.authorName.trim() || 'Jefatura SMS',
                        authorRole: this.newNotice.authorRole.trim() || 'Jefe de Seguridad',
                        title: { es: this.newNotice.titleEs.trim(), en: this.newNotice.titleEn.trim() },
                        content: { es: this.newNotice.contentEs.trim(), en: this.newNotice.contentEn.trim() }
                    };

                    this.announcements.unshift(newEntry);
                    localStorage.setItem('smartcargo_announcements_local', JSON.stringify(this.announcements));
                    this.clearFormWithWarning();
                    alert(this.lang === 'es' ? '¡Aviso publicado exitosamente en todos los canales requeridos!' : 'Notice successfully published to all target channels!');
                    this.$nextTick(() => lucide.createIcons());
                },
                withdrawNotice(id) {
                    const item = this.announcements.find(a => a.id === id);
                    if (item) {
                        item.status = 'Withdrawn';
                        localStorage.setItem('smartcargo_announcements_local', JSON.stringify(this.announcements));
                    }
                }
            };
        }
